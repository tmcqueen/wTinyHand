[package]
name = "tinyhand"
version = "0.1.0"
edition = "2021"
description = "A tiny hand on a stick that points at things on your Linux screen"
license = "MIT"

[dependencies]
smithay-client-toolkit = "0.19"
tiny-skia = "0.11"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
serde_json = "1"
serde = "1"
ctrlc = { version = "3", features = ["termination"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 2
